# Production external-bind profile.
# Import staged model bytes first:
# llmctl --config /etc/rs-llmctl/config.toml model import-manifest examples/offline-model-manifest.toml
mode = "weighted"

[server]
host = "0.0.0.0"
port = 8765
worker_base_port = 18765
llama_server = "/usr/local/bin/llama-server"
context_size = 16384
# Required for browser-based OpenAI/AQE clients. Keep empty when access is
# server-to-server only.
cors_allowed_origins = ["https://aqe.example.com"]

[security]
production = true
require_auth = true
bind_external = true

[security.tls-termination]
enabled = true
provider = "envoy-edge"
evidence = "change-record-or-runbook-url"
m-tls = true

[[security.api_keys]]
id = "prod-operator-placeholder"
sha256 = "2222222222222222222222222222222222222222222222222222222222222222"
subject = "aqe-prod"
team = "platform"
scopes = ["chat", "models", "admin"]

[resources]
budget = 0.80
cpu_only = false
gpu_vendor = "auto"

[storage]
db_path = "/var/lib/rs-llmctl/llmctl.db"
model_dir = "/var/lib/rs-llmctl/models"

[observability]
service_name = "rs-llmctl"
environment = "production"
traces_enabled = true
metrics_enabled = true
logs_enabled = true

[observability.exporter]
endpoint = "https://otel-collector.example.internal/v1/traces"
protocol = "http-protobuf"
headers = { authorization = "env:OTEL_EXPORTER_OTLP_AUTHORIZATION", "x-tenant" = "platform" }
timeout_ms = 5000

[audit]
retention-days = 365
report-directory = "/var/log/rs-llmctl/reports"
report-formats = ["json", "jsonl"]
monthly-reports = true

[[models]]
alias = "qwen-prod"
path = "/var/lib/rs-llmctl/models/qwen.gguf"
role = "chat"
weight = 100

[[quotas]]
subject = "aqe-prod"
team = "platform"
requests_per_minute = 600
tokens_per_day = 50000000
max_concurrency = 16
allowed_models = ["qwen-prod"]
