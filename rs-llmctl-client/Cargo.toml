[package]
name = "rs-llmctl-client"
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Typed async Rust client SDK for rs-llmctl"

[dependencies]
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
axum = "0.7"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "net"] }
