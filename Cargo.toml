[package]
name = "rs-llmctl"
version = "1.7.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = ["rs-llmctl-client"]

[[bin]]
name = "llmctl"
path = "src/bin/llmctl.rs"

[features]
default = ["native"]
native = ["native-candle"]
candle-core = ["dep:candle-core"]
candle-nn = ["dep:candle-nn"]
candle-transformers = ["dep:candle-transformers"]
native-candle = ["candle-core", "candle-nn", "candle-transformers", "native-tokenizers"]
native-tokenizers = ["tokenizers"]
tokenizers = ["dep:tokenizers"]
# GPU acceleration. Mutually exclusive in practice — enable one per build.
# `gpu-metal`: Apple Silicon (Metal). Default GPU on macOS arm64.
# `gpu-cuda`:  NVIDIA (CUDA) on Linux/Windows; also works with AMD GPUs on
#              Linux via ROCm/HIP's CUDA shim (requires ROCm install and
#              HIP_PLATFORM=amd at build time).
gpu-metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    # When the mistral-rs backend is also enabled, propagate Metal support
    # into it. The `?` syntax keeps this a no-op when `mistral-rs` is off.
    "mistralrs?/metal",
]
gpu-cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "mistralrs?/cuda",
]
# `mistral-rs`: opt-in second inference backend (the `mistralrs` crate from
# EricLBuehler/mistral.rs). Used for models that candle 0.10.2 can't run —
# specifically the non-canonical-head_dim Mistrals (Devstral, Mistral Small)
# and Metal-MoE workloads. See docs/native-gguf-internals.md.
mistral-rs = ["dep:mistralrs"]
# `llama-cpp-native`: opt-in llama.cpp binding backend via llama-cpp-2 crate.
llama-cpp-native = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
anyhow = "1.0"
arrow = "58.3.0"
async-stream = "0.3"
axum = "0.7"
base64 = "0.22"
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
encoding_rs = { version = "0.8", optional = true }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
hyper = "1.9"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
libc = "0.2"
llama-cpp-2 = { version = "0.1.150", optional = true, features = ["dynamic-backends"] }
# Pinned to the latest published crates.io version. Pulls a tokio-async
# Pipeline/Loader stack — only resolves when the `mistral-rs` feature is on.
mistralrs = { version = "0.8.1", optional = true, default-features = false }
opentelemetry = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "http-proto", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
parquet = "58.3.0"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "any", "chrono"] }
subtle = "2.6"
sysinfo = "0.33"
tokenizers = { version = "0.22.2", optional = true, default-features = false, features = ["onig"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "process", "signal", "fs", "io-util", "time", "net"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
toml = "0.8"
tonic = { version = "0.14.6", default-features = false }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"
