[package]
name = "rs-llmctl"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "llmctl"
path = "src/bin/llmctl.rs"

[[bin]]
name = "llmctld"
path = "src/bin/llmctld.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
sysinfo = "0.33"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "process", "signal", "fs", "io-util", "time", "net"] }
tokio-stream = "0.1"
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"
tower = "0.5"
