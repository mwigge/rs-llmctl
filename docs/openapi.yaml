openapi: 3.1.0
info:
  title: rs-llmctl native API
  version: 1.2.1
  description: OpenAI-compatible local LLM API served through the rs-llmctl native control plane.
servers:
  - url: http://localhost:8765
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive.
  /livez:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive.
  /readyz:
    get:
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Storage and at least one model are ready.
        "503":
          description: Node is unavailable or draining.
  /v1/models:
    get:
      summary: List configured local models
      description: |
        OpenAI-compatible model list. Each entry adds a `capabilities` object
        with runtime metadata that external orchestrators can use to route
        without out-of-band knowledge. The capability fields are additive —
        clients that consume only the standard OpenAI Models fields
        (`id`, `object`, `owned_by`) continue to work unchanged.
      responses:
        "200":
          description: OpenAI-compatible model list with capability metadata.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, owned_by, capabilities]
                      properties:
                        id:
                          type: string
                          description: Model alias as configured in `models[].alias`.
                        object:
                          type: string
                          enum: [model]
                        owned_by:
                          type: string
                          enum: [rs-llmctl]
                        capabilities:
                          type: object
                          required:
                            [context_window, tool_protocol, model_size_b, gpu_backend, tier]
                          properties:
                            context_window:
                              type: integer
                              description: |
                                Maximum context window in tokens. `0` when the
                                family is unknown.
                            tool_protocol:
                              type: string
                              description: |
                                Stable identifier for the model's native tool-call
                                format. One of `qwen3-native`, `gemma4-native`,
                                `none`.
                              enum: [qwen3-native, gemma4-native, none]
                            model_size_b:
                              type: number
                              description: |
                                Approximate parameter count in billions, parsed
                                from the alias (e.g. `qwen3-14b` → `14.0`). `0.0`
                                when not derivable.
                            gpu_backend:
                              type: string
                              description: |
                                The compute backend bound at server startup. Always
                                one of three values; does not vary per model.
                              enum: [metal, cuda, cpu]
                            tier:
                              type: string
                              description: |
                                Hardware tier classification. See
                                `runtime::tier::HardwareTier::as_str()`.
                              enum: [tier1-nv6, tier2-nv12, tier3-amd16, tier3-mac, unknown]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      description: Supports non-streaming JSON responses and streaming `text/event-stream` frames ending in `[DONE]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: true
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                stream:
                  type: boolean
                tools:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: OpenAI-compatible chat completion or SSE stream.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Model alias was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Native runtime or model is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/embeddings:
    post:
      summary: Create embeddings through the native runtime
      responses:
        "200":
          description: OpenAI-compatible embeddings response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Native embedding runtime is unavailable.
  /v1/local/search:
    post:
      summary: Search caller-supplied local documents
      responses:
        "200":
          description: Ranked local search results.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/local/recommendations:
    post:
      summary: Recommend caller-supplied local documents
      responses:
        "200":
          description: Ranked local recommendations.
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Request rejected by auth throttling, quota, or admission control.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [message, type, code, status]
          additionalProperties: true
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
            status:
              type: integer
