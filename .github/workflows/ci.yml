name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check feature matrix
        run: |
          cargo check --workspace --all-targets --no-default-features
          cargo check --workspace --all-targets --no-default-features --features native-tokenizers
          cargo check --workspace --all-targets --no-default-features --features native-candle
          cargo check --workspace --all-targets --no-default-features --features native
          cargo check --workspace --all-targets --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build release binaries
        run: cargo build --release --bin llmctl

      - name: Generate release checksums
        run: packaging/generate-checksums.sh

      - name: Generate release SBOM evidence
        run: packaging/generate-sbom.sh dist

      - name: Install cosign for tagged release signing
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign release checksums for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        run: packaging/sign-release.sh dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/rs-llmctl-*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.*
            dist/rs-llmctl*.cdx.json
            dist/rs-llmctl.sbom-fallback.json
            dist/Cargo.lock

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(
            dist/rs-llmctl-*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.*
            dist/rs-llmctl*.cdx.json
            dist/rs-llmctl.sbom-fallback.json
            dist/Cargo.lock
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file CHANGELOG.md \
              "${assets[@]}"
          fi

  native-release-smoke:
    name: Native release smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, llmctl-native-smoke]
    environment: native-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native release binary
        run: cargo build --release --bin llmctl --all-features

      - name: Package native release artifact
        run: packaging/generate-checksums.sh

      - name: Run native release smoke with mounted model artifacts
        env:
          LLMCTL_NATIVE_SMOKE_CONFIG: ${{ secrets.LLMCTL_NATIVE_SMOKE_CONFIG }}
          LLMCTL_NATIVE_SMOKE_CONFIG_TOML: ${{ secrets.LLMCTL_NATIVE_SMOKE_CONFIG_TOML }}
          LLMCTL_NATIVE_SMOKE_MODEL_PATH: ${{ secrets.LLMCTL_NATIVE_SMOKE_MODEL_PATH }}
          LLMCTL_NATIVE_SMOKE_API_KEY: ${{ secrets.LLMCTL_NATIVE_SMOKE_API_KEY }}
          LLMCTL_NATIVE_SMOKE_MODEL: ${{ vars.LLMCTL_NATIVE_SMOKE_MODEL }}
        run: tests/smoke/smoke_native_release.sh
