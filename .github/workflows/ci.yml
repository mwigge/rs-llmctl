name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check feature matrix
        run: |
          cargo check --workspace --all-targets --no-default-features
          cargo check --workspace --all-targets --no-default-features --features native-tokenizers
          cargo check --workspace --all-targets --no-default-features --features native-candle
          cargo check --workspace --all-targets --no-default-features --features native
          cargo check --workspace --all-targets --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

      - name: Run tests
        run: cargo test --all-targets --all-features

  build-linux:
    name: Build linux/x86_64
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin llmctl

      - name: Package release artifact
        run: packaging/generate-checksums.sh

      - name: Generate release SBOM evidence
        run: packaging/generate-sbom.sh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/rs-llmctl-linux-x86_64.tar.gz
            dist/Cargo.lock
            dist/rs-llmctl.sbom-fallback.json

  build-macos:
    name: Build darwin/aarch64
    runs-on: macos-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin llmctl

      - name: Package release artifact
        run: packaging/generate-checksums.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/rs-llmctl-darwin-aarch64.tar.gz

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist

      - name: Generate combined SHA256SUMS
        run: |
          cd dist
          sha256sum rs-llmctl-*.tar.gz | sort -k2 > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release checksums
        run: packaging/sign-release.sh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(
            dist/rs-llmctl-*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.*
            dist/rs-llmctl*.cdx.json
            dist/rs-llmctl.sbom-fallback.json
            dist/Cargo.lock
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file CHANGELOG.md \
              "${assets[@]}"
          fi

  native-release-smoke:
    name: Native release smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, llmctl-native-smoke]
    environment: native-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native release binary
        run: cargo build --release --bin llmctl --all-features

      - name: Package native release artifact
        run: packaging/generate-checksums.sh

      - name: Run native release smoke with mounted model artifacts
        env:
          LLMCTL_NATIVE_SMOKE_MODEL_PATH: ${{ secrets.LLMCTL_NATIVE_SMOKE_MODEL_PATH }}
          LLMCTL_NATIVE_SMOKE_MODEL: ${{ vars.LLMCTL_NATIVE_SMOKE_MODEL }}
        run: tests/smoke/smoke_native_release.sh
